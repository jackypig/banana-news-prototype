name: Update World Cup Standings

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run standings scraper
        run: python3 scripts/update_standings.py

      - name: Commit updated standings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sections/worldcup/data.json
          git diff --cached --quiet || git commit -m "chore: update World Cup standings [skip ci]"
          git push
